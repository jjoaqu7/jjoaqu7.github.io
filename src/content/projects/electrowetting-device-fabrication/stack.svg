<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1000 330" width="1000" height="330" role="img" aria-label="Cross-section of the electrowetting device stack, not to scale">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b3bac0" stroke-width="1.2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16202a; font-size: 15px; }
    .sub { fill: #52606d; font-size: 13px; }
    .lead { stroke: #8a949c; stroke-width: 1; fill: none; }
    .wire { stroke: #16202a; stroke-width: 1.6; fill: none; }
  </style>

  <rect y="150" width="1000" height="330" fill="#ffffff"/>

  <!-- Droplet -->
  <path d="M 230 236 A 130 130 0 0 1 450 236 Z" fill="#d4e8f7" stroke="#3d7fb8" stroke-width="1.6"/>
  <ellipse cx="300" cy="200" rx="18" ry="8" fill="#ffffff" opacity="0.8"/>

  <!-- Layers, top to bottom -->
  <rect x="120" y="236" width="480" height="8" fill="#cfe9d6" stroke="#5fa877" stroke-width="1"/>
  <rect x="120" y="244" width="480" height="52" fill="#a9cbe8" stroke="#3d7fb8" stroke-width="1"/>
  <rect x="120" y="284" width="90" height="12" fill="#e2b93b" stroke="#a7841d" stroke-width="1"/>
  <rect x="265" y="284" width="130" height="12" fill="#e2b93b" stroke="#a7841d" stroke-width="1"/>
  <rect x="450" y="284" width="110" height="12" fill="#e2b93b" stroke="#a7841d" stroke-width="1"/>
  <rect x="120" y="296" width="480" height="30" fill="#dbe9f6" stroke="#7aa7cf" stroke-width="1"/>
  <rect x="120" y="326" width="480" height="104" fill="#e3e6e9" stroke="#8a949c" stroke-width="1"/>
  <rect x="120" y="326" width="480" height="104" fill="url(#hatch)"/>

  <!-- AC drive between an electrode and the substrate -->
  <circle cx="60" cy="340" r="20" fill="#ffffff" stroke="#16202a" stroke-width="1.6"/>
  <path d="M 47 340 C 52 328, 56 328, 60 340 S 68 352, 73 340" class="wire"/>
  <path d="M 60 320 L 60 290 L 120 290" class="wire"/>
  <path d="M 60 360 L 60 400 L 120 400" class="wire"/>
  <text x="18" y="445" class="sub">120 Vpp, 250 Hz</text>
  <path d="M 340 430 L 340 448 M 326 448 L 354 448 M 331 454 L 349 454 M 336 460 L 344 460" class="wire"/>

  <!-- Labels -->
  <path d="M 452 190 L 640 190" class="lead"/>
  <text x="648" y="195">Water droplet</text>

  <path d="M 600 240 L 625 240 L 640 228" class="lead"/>
  <text x="648" y="233">Fluoropel hydrophobic coat</text>

  <path d="M 600 264 L 640 262" class="lead"/>
  <text x="648" y="267">PECVD SiNₓ, 150 nm <tspan class="sub">top dielectric</tspan></text>

  <path d="M 560 290 L 640 296" class="lead"/>
  <text x="648" y="301">Ti / Au electrodes, 5 / 50 nm</text>

  <path d="M 600 312 L 625 312 L 640 330" class="lead"/>
  <text x="648" y="335">LPCVD SiNₓ, 100 nm <tspan class="sub">bottom dielectric</tspan></text>

  <path d="M 600 380 L 640 380" class="lead"/>
  <text x="648" y="378">Boron-doped Si, 500 µm</text>
  <text x="648" y="397" class="sub">conductive substrate, reference electrode</text>

  <text x="400" y="458" class="sub">Not to scale</text>
</svg>

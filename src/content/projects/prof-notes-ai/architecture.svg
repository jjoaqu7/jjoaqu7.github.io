<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Prof Notes AI architecture: lecture slides are extracted and indexed; student questions go through an API gateway to notes, Wikipedia and YouTube services">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4b57"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16202a; }
    .h { font-size: 15.5px; font-weight: 640; }
    .s { font-size: 12.5px; fill: #52606d; }
    .k { font-size: 11.5px; font-weight: 650; letter-spacing: 0.08em; fill: #0a6b6b; }
    .box { fill: #f4f7f7; stroke: #9db2b2; stroke-width: 1.2; }
    .io { fill: #e2f0ef; stroke: #0a6b6b; stroke-width: 1.2; }
    .ar { stroke: #3f4b57; stroke-width: 1.6; fill: none; }
  </style>

  <rect width="1000" height="380" fill="#ffffff"/>

  <text class="k" x="20" y="24">INGESTION</text>
  <rect class="io" x="20" y="36" width="190" height="64" rx="10"/>
  <text class="h" x="38" y="64">Lecture slides</text>
  <text class="s" x="38" y="84">PDF uploaded by instructor</text>

  <rect class="box" x="270" y="36" width="250" height="64" rx="10"/>
  <text class="h" x="288" y="64">PDF extraction service</text>
  <text class="s" x="288" y="84">Cloud Run, Adobe PDF Extract API</text>

  <rect class="box" x="580" y="36" width="210" height="64" rx="10"/>
  <text class="h" x="598" y="64">Vector index</text>
  <text class="s" x="598" y="84">Pinecone, one per course</text>

  <path class="ar" d="M 212 68 L 266 68" marker-end="url(#arrow)"/>
  <path class="ar" d="M 522 68 L 576 68" marker-end="url(#arrow)"/>

  <text class="k" x="20" y="164">ANSWERING</text>
  <rect class="io" x="20" y="226" width="190" height="64" rx="10"/>
  <text class="h" x="38" y="254">Student question</text>
  <text class="s" x="38" y="274">course web app</text>

  <rect class="box" x="270" y="226" width="250" height="64" rx="10"/>
  <text class="h" x="288" y="254">API gateway</text>
  <text class="s" x="288" y="274">Python on Google App Engine</text>

  <rect class="box" x="580" y="176" width="210" height="50" rx="10"/>
  <text class="h" x="598" y="206">Lecture notes service</text>
  <rect class="box" x="580" y="234" width="210" height="50" rx="10"/>
  <text class="h" x="598" y="264">Wikipedia service</text>
  <rect class="box" x="580" y="292" width="210" height="50" rx="10"/>
  <text class="h" x="598" y="322">YouTube service</text>

  <rect class="io" x="840" y="226" width="140" height="64" rx="10"/>
  <text class="h" x="856" y="254">Answer</text>
  <text class="s" x="856" y="274">with sources</text>

  <path class="ar" d="M 212 258 L 266 258" marker-end="url(#arrow)"/>
  <path class="ar" d="M 522 258 L 550 258 L 550 201 L 576 201" marker-end="url(#arrow)"/>
  <path class="ar" d="M 550 258 L 576 258" marker-end="url(#arrow)"/>
  <path class="ar" d="M 550 258 L 550 317 L 576 317" marker-end="url(#arrow)"/>
  <path class="ar" d="M 792 201 L 815 201 L 815 258 L 836 258" marker-end="url(#arrow)"/>
  <path class="ar" d="M 792 259 L 836 259"/>
  <path class="ar" d="M 792 317 L 815 317 L 815 258"/>
  <path class="ar" d="M 685 102 L 685 172" marker-end="url(#arrow)"/>
</svg>

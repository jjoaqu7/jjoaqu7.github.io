<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="ARIA workflow: Conversation, Retriever, Processor and Suggester modules, with researcher checkpoints">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4b57"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #16202a; }
    .h { font-size: 17px; font-weight: 650; }
    .k { font-size: 11.5px; font-weight: 650; letter-spacing: 0.08em; fill: #0a6b6b; }
    .b { font-size: 14px; fill: #3f4b57; }
    .box { fill: #f4f7f7; stroke: #9db2b2; stroke-width: 1.2; }
    .ar { stroke: #3f4b57; stroke-width: 1.6; fill: none; }
    .ck { stroke: #0a6b6b; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  </style>

  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- Modules -->
  <rect class="box" x="20" y="30" width="215" height="190" rx="10"/>
  <text class="k" x="38" y="58">MODULE 1</text>
  <text class="h" x="38" y="82">Conversation</text>
  <text class="b" x="38" y="112">Breaks the research</text>
  <text class="b" x="38" y="131">question into a scope</text>
  <text class="b" x="38" y="156">Proposes search phrases</text>
  <text class="b" x="38" y="181">Asks the researcher to</text>
  <text class="b" x="38" y="200">approve each step</text>

  <rect class="box" x="265" y="30" width="215" height="190" rx="10"/>
  <text class="k" x="283" y="58">MODULE 2</text>
  <text class="h" x="283" y="82">Retriever</text>
  <text class="b" x="283" y="112">Boolean queries to</text>
  <text class="b" x="283" y="131">literature databases</text>
  <text class="b" x="283" y="156">Citation snowballing</text>
  <text class="b" x="283" y="181">Abstract screening</text>

  <rect class="box" x="510" y="30" width="215" height="190" rx="10"/>
  <text class="k" x="528" y="58">MODULE 3</text>
  <text class="h" x="528" y="82">Processor</text>
  <text class="b" x="528" y="112">Full-text retrieval</text>
  <text class="b" x="528" y="137">Extracts text, equations</text>
  <text class="b" x="528" y="156">and figures</text>
  <text class="b" x="528" y="181">Multimodal index that</text>
  <text class="b" x="528" y="200">keeps each source</text>

  <rect class="box" x="755" y="30" width="225" height="190" rx="10"/>
  <text class="k" x="773" y="58">MODULE 4</text>
  <text class="h" x="773" y="82">Suggester</text>
  <text class="b" x="773" y="112">Several LLMs work</text>
  <text class="b" x="773" y="131">together on the plan</text>
  <text class="b" x="773" y="156">Writes a structured</text>
  <text class="b" x="773" y="175">research procedure</text>

  <path class="ar" d="M 237 125 L 261 125" marker-end="url(#arrow)"/>
  <path class="ar" d="M 482 125 L 506 125" marker-end="url(#arrow)"/>
  <path class="ar" d="M 727 125 L 751 125" marker-end="url(#arrow)"/>

  <!-- Researcher in the loop -->
  <rect x="20" y="270" width="960" height="60" rx="10" fill="#e2f0ef" stroke="#0a6b6b" stroke-width="1.2"/>
  <text class="h" x="500" y="306" text-anchor="middle" style="font-size:15px">Researcher in the loop, approving each checkpoint</text>

  <path class="ck" d="M 160 220 L 160 270"/>
  <rect x="153" y="238" width="14" height="14" fill="#ffffff" stroke="#0a6b6b" stroke-width="1.4" transform="rotate(45 160 245)"/>
  <text class="b" x="176" y="250" style="font-size:13px">scope review</text>

  <path class="ck" d="M 372 220 L 372 270"/>
  <rect x="365" y="238" width="14" height="14" fill="#ffffff" stroke="#0a6b6b" stroke-width="1.4" transform="rotate(45 372 245)"/>
  <text class="b" x="388" y="250" style="font-size:13px">search phrase review</text>

  <path class="ck" d="M 867 220 L 867 270"/>
  <rect x="860" y="238" width="14" height="14" fill="#ffffff" stroke="#0a6b6b" stroke-width="1.4" transform="rotate(45 867 245)"/>
  <text class="b" x="851" y="250" text-anchor="end" style="font-size:13px">specification review</text>
</svg>
